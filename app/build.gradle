plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The update signing key.
//
// Committed on purpose: Android only installs an update signed with the same key as the installed
// app, and three separate CI runs of this project were measured to carry three different keys
// (see .github/signing/README.md). A stable key is the one property an in-app updater needs.
//
// A missing keystore falls back to Gradle's own debug signing, which still builds: the app must not
// become unbuildable for someone who cloned a branch without the file. It cannot update itself in
// that case, and the update screen shows the key it actually has.
def updateKeystore = rootProject.file('.github/signing/clonehub-signing.p12')
def hasUpdateKeystore = updateKeystore.exists()

android {
    namespace 'com.clonehub.advanced'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.clonehub.pro"
        minSdk 24
        targetSdk 35
        // The in-app updater compares THIS number with the build-<versionCode> in the release title,
        // and the publish workflow reads the compiled value back out of the APK. Bumping it is the
        // only way a new build reaches installed copies; a new versionName alone is not an update.
        versionCode 2002
        versionName "2.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasUpdateKeystore) {
            update {
                storeFile updateKeystore
                storeType 'pkcs12'
                storePassword 'clonehub'
                keyAlias 'clonehub'
                keyPassword 'clonehub'
            }
        }
    }

    buildTypes {
        // The APK this project has been handing out as "2.0.2" - the one in Drive and in the
        // repository's own releases before build-2002 - identified itself as
        // com.clonehub.advanced.debug. Android refuses to update a different package name, and it
        // refuses to update a package signed with another key either, so that artifact could never
        // be updated in place: the user had to uninstall first. This flavour reproduces it exactly
        // (same applicationId, same default debug key, same versionCode) so the migration can be
        // tested instead of described.
        legacyDebug {
            initWith debug
            applicationIdSuffix ".debug"
            versionCode 2001
            versionName "2.0.1"
            // The key that artifact carried was a per-machine Gradle debug key, so this flavour
            // signs with Gradle's default as well - on purpose, to reproduce the failure.
            signingConfig null
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            // Keep the tested APK's package identical to the installable main app.
            // The bundled VM uses legacy JNI references in virtual agent processes.
            debuggable false
            // One key for every machine, so a build can update the previous build.
            if (hasUpdateKeystore) {
                signingConfig signingConfigs.update
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        // Errors that would ship a broken or unsafe build fail CI.
        abortOnError true
        checkReleaseBuilds true
        lintConfig file("lint.xml")
        textReport true
        // The bundled runtime is prebuilt and never minified away.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Coroutines & Lifecycle
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Data Storage & Fast Serialization
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'
    // org.json is a stub in the Android SDK: the updater's parser is pure Kotlin over it, so the unit
    // tests need the real implementation rather than a class that throws "not mocked".
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
