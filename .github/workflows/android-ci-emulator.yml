name: Android CI & Live Emulator Test

on:
  # Manual diagnostic only: the bundled original runtime also crashes under
  # x86_64 ARM translation. Native ARM64 redroid is the default CI gate.
  workflow_dispatch:

jobs:
  build:
    name: Build APK and instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Run unit tests and build APKs
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Stage APKs with deterministic names
        run: |
          mkdir -p staged-apks
          cp app/build/outputs/apk/debug/app-debug.apk staged-apks/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk staged-apks/app-debug-androidTest.apk

      - name: Upload build-only APKs
        uses: actions/upload-artifact@v4
        with:
          name: CloneHub-Pro-build-binaries
          path: staged-apks/*.apk
          if-no-files-found: error

  emulator-e2e:
    name: Strict Android 14 emulator E2E
    needs: build
    # Linux x64 supports KVM acceleration; ARM64 macOS nested HVF is unsupported.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PACKAGE_ID: com.clonehub.pro
      TEST_PACKAGE_ID: com.clonehub.pro.test
      MAIN_ACTIVITY: com.clonehub.advanced.ui.home.HomeActivity
    steps:
      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APKs from build job
        uses: actions/download-artifact@v4
        with:
          name: CloneHub-Pro-build-binaries
          path: artifacts

      - name: Boot emulator and run strict E2E checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Google APIs x86_64 images include ARM64 translation required by the bundled runtime.
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash .github/scripts/run-emulator-e2e.sh
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CloneHub-Pro-emulator-evidence
          path: evidence/
          if-no-files-found: error

      - name: Upload verified debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CloneHub-Pro-v2.0.1-verified-debug
          path: artifacts/app-debug.apk
          if-no-files-found: error
