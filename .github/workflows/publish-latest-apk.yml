name: Publish latest verified APK

on:
  workflow_run:
    workflows:
      - "Native ARM64 redroid strict E2E"
      - "Native ARM64 deep clone testing"
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: latest-verified-apk-release
  cancel-in-progress: false

jobs:
  publish:
    name: Update stable latest APK download
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify both gates and current main
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$REPO/commits/main" --jq '.sha')"
          if [[ "$main_sha" != "$HEAD_SHA" ]]; then
            echo "Skipping an older commit: $HEAD_SHA (current main is $main_sha)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100" > runs.json
          strict_run_id="$(jq -r '[.workflow_runs[] | select(.name == "Native ARM64 redroid strict E2E" and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' runs.json)"
          deep_state="$(jq -r '[.workflow_runs[] | select(.name == "Native ARM64 deep clone testing")] | sort_by(.created_at) | last | if . == null then "missing" elif .status != "completed" then .status else .conclusion end' runs.json)"
          if [[ -z "$strict_run_id" || "$deep_state" != "success" ]]; then
            # Not the same thing as "an older commit won the race": here the gates for THIS commit
            # are missing or not green. Printing both states is what makes that readable — the
            # previous run pasted "Verified gates are not both ready (deep=success)" beside a strict
            # run that was still in progress, which read like a contradiction.
            echo "This commit's gates are not both green yet: strict=${strict_run_id:-none} deep=$deep_state (HEAD_SHA=$HEAD_SHA, main=$main_sha)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "strict-run-id=$strict_run_id" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download strict-gate verified APK
        if: steps.verify.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          run_id="${{ steps.verify.outputs.strict-run-id }}"
          artifact_id="$(gh api "repos/$REPO/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.name == "CloneHub-Pro-native-ARM64-verified-debug" and .expired == false) | .id' | head -n 1)"
          if [[ -z "$artifact_id" ]]; then
            echo "The verified APK artifact is missing or expired."
            exit 1
          fi
          gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > verified-apk.zip
          unzip -q verified-apk.zip -d verified-apk
          test -f verified-apk/app-debug.apk
          cp verified-apk/app-debug.apk CloneHub-Pro.apk
          unzip -t CloneHub-Pro.apk > /dev/null
          sha256sum CloneHub-Pro.apk

      - name: Publish or update stable latest release
        if: steps.verify.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          title="CloneHub Pro - Latest Verified APK"
          notes="Latest main APK published only after both native ARM64 test gates pass. Verified commit: $HEAD_SHA"
          if gh release view latest-verified --repo "$REPO" > /dev/null 2>&1; then
            gh release upload latest-verified CloneHub-Pro.apk --repo "$REPO" --clobber
            gh release edit latest-verified --repo "$REPO" --latest --title "$title" --notes "$notes"
          else
            gh release create latest-verified CloneHub-Pro.apk --repo "$REPO" \
              --target "$HEAD_SHA" --latest --title "$title" --notes "$notes"
          fi
          echo "Direct download: https://github.com/$REPO/releases/latest/download/CloneHub-Pro.apk"

      - name: Say what happened
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.verify.outputs.publish }}" == "true" ]]; then
            echo "Published the APK verified by strict run ${{ steps.verify.outputs.strict-run-id }} for $HEAD_SHA."
          else
            echo "Nothing published: the strict and deep gates for $HEAD_SHA were not both green when this ran, so the release still points at an earlier commit."
          fi
