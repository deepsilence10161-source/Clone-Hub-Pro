name: Publish latest verified APK

on:
  workflow_run:
    workflows:
      - "Native ARM64 redroid strict E2E"
      - "Native ARM64 deep clone testing"
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: latest-verified-apk-release
  cancel-in-progress: false

jobs:
  publish:
    name: Update stable latest APK download
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify both gates and current main
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$REPO/commits/main" --jq '.sha')"
          if [[ "$main_sha" != "$HEAD_SHA" ]]; then
            echo "Skipping an older commit: $HEAD_SHA (current main is $main_sha)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100" > runs.json
          strict_run_id="$(jq -r '[.workflow_runs[] | select(.name == "Native ARM64 redroid strict E2E" and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' runs.json)"
          deep_state="$(jq -r '[.workflow_runs[] | select(.name == "Native ARM64 deep clone testing")] | sort_by(.created_at) | last | if . == null then "missing" elif .status != "completed" then .status else .conclusion end' runs.json)"
          if [[ -z "$strict_run_id" || "$deep_state" != "success" ]]; then
            # Not the same thing as "an older commit won the race": here the gates for THIS commit
            # are missing or not green. Printing both states is what makes that readable — the
            # previous run pasted "Verified gates are not both ready (deep=success)" beside a strict
            # run that was still in progress, which read like a contradiction.
            echo "This commit's gates are not both green yet: strict=${strict_run_id:-none} deep=$deep_state (HEAD_SHA=$HEAD_SHA, main=$main_sha)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "strict-run-id=$strict_run_id" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download strict-gate verified APK
        id: apk
        if: steps.verify.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          run_id="${{ steps.verify.outputs.strict-run-id }}"
          artifact_id="$(gh api "repos/$REPO/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.name == "CloneHub-Pro-native-ARM64-verified-debug" and .expired == false) | .id' | head -n 1)"
          if [[ -z "$artifact_id" ]]; then
            echo "The verified APK artifact is missing or expired."
            exit 1
          fi
          gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > verified-apk.zip
          unzip -q verified-apk.zip -d verified-apk
          test -f verified-apk/app-debug.apk
          cp verified-apk/app-debug.apk CloneHub-Pro.apk
          unzip -t CloneHub-Pro.apk > /dev/null
          sha256sum CloneHub-Pro.apk

          # The in-app updater reads these two numbers out of the release, and neither may be guessed:
          # the phone compares versionCodes, and sha256 is what it checks the download against.
          #
          # The APK's own manifest is decoded here rather than taken from the gradle file, because the
          # value the phone sees is the one compiled into the binary. aapt2 ships with the SDK the
          # runners already have; if it is missing the step fails instead of publishing an update the
          # app cannot recognise.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2="$(find "$SDK/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$AAPT2" ]]; then
            echo "No aapt2 found under $SDK; cannot decode versionCode, refusing to publish." >&2
            exit 1
          fi
          chmod +x "$AAPT2" || true
          "$AAPT2" dump badging CloneHub-Pro.apk > apk-badging.txt
          # `aapt2 dump badging` prints:  package: name='com.clonehub.pro' versionCode='2001' versionName='2.0.1' …
          # The apostrophes are quoted for the shell, not for sed: a pattern written with them stops
          # being a valid regex and sed fails at runtime (caught by bash -n on this very step).
          VERSION_CODE="$(grep -o "versionCode='[0-9]*'" apk-badging.txt | head -n 1 | tr -cd '0-9')"
          VERSION_NAME="$(grep -o "versionName='[^']*'" apk-badging.txt | head -n 1 | sed 's/versionName=.//; s/.$//')"
          PACKAGE_NAME="$(grep -o "^package: name='[^']*'" apk-badging.txt | head -n 1 | sed 's/^package: name=.//; s/.$//')"
          SHA256="$(sha256sum CloneHub-Pro.apk | cut -d' ' -f1)"
          SIZE="$(stat -c %s CloneHub-Pro.apk)"
          if [[ -z "$VERSION_CODE" || -z "$PACKAGE_NAME" || -z "$SHA256" ]]; then
            echo "Could not read versionCode/package from the APK; refusing to publish." >&2
            cat apk-badging.txt >&2
            exit 1
          fi
          printf '%s\n' "$VERSION_CODE" "$VERSION_NAME" "$PACKAGE_NAME" "$SHA256" "$SIZE" > verified-facts.txt
          {
            echo "version-code=$VERSION_CODE"
            echo "version-name=$VERSION_NAME"
            echo "package=$PACKAGE_NAME"
            echo "sha256=$SHA256"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"
          cat verified-facts.txt

      - name: Publish or update stable latest release
        if: steps.verify.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The tag and notes are the update channel the app reads, so they must contain what the
          # updater needs and nothing it would have to guess:
          #   - `build-<versionCode>` in the title: the only field the app trusts for "is this newer";
          #   - `sha256:` and the byte size in the notes: the digest the download is checked against,
          #     and the size a truncated download is caught by;
          #   - the commit, so a human can trace a build back to a gate run.
          version_code="${{ steps.apk.outputs.version-code }}"
          version_name="${{ steps.apk.outputs.version-name }}"
          sha256="${{ steps.apk.outputs.sha256 }}"
          size="${{ steps.apk.outputs.size }}"
          title="CloneHub Pro - Latest Verified APK (build-$version_code)"
          notes="$(printf '%s\n' \
            "Clone Hub Pro $version_name, build-$version_code." \
            "" \
            "sha256:$sha256" \
            "size:$size" \
            "" \
            "Published only after both native ARM64 test gates passed on main. Verified commit: $HEAD_SHA" \
            "" \
            "The in-app updater (overflow menu > App updates) reads this release: the build number in" \
            "the title is compared with the installed versionCode, and the sha256 below is what the" \
            "downloaded file is checked against before Android's installer sees it.")"
          # Keep the old tag for existing links, and add a versioned one so each build stays
          # addressable after the next release overwrites the latest APK.
          versioned_tag="verified-build-$version_code"
          if gh release view latest-verified --repo "$REPO" > /dev/null 2>&1; then
            gh release upload latest-verified CloneHub-Pro.apk --repo "$REPO" --clobber
            gh release edit latest-verified --repo "$REPO" --latest --title "$title" --notes "$notes"
          else
            gh release create latest-verified CloneHub-Pro.apk --repo "$REPO" \
              --target "$HEAD_SHA" --latest --title "$title" --notes "$notes"
          fi
          echo "Direct download: https://github.com/$REPO/releases/latest/download/CloneHub-Pro.apk"

          # A permanent, addressable copy per build: "latest-verified" is overwritten every release,
          # which is right for the updater's channel but useless as a record. A versioned tag keeps
          # every build's exact bytes, digest and gate run traceable.
          if gh release view "$versioned_tag" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$versioned_tag" CloneHub-Pro.apk --repo "$REPO" --clobber
          else
            gh release create "$versioned_tag" CloneHub-Pro.apk --repo "$REPO" \
              --target "$HEAD_SHA" --title "Clone Hub Pro build-$version_code" --notes "$notes"
          fi

      - name: Say what happened
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.verify.outputs.publish }}" == "true" ]]; then
            echo "Published the APK verified by strict run ${{ steps.verify.outputs.strict-run-id }} for $HEAD_SHA."
          else
            echo "Nothing published: the strict and deep gates for $HEAD_SHA were not both green when this ran, so the release still points at an earlier commit."
          fi
