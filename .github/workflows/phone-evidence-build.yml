name: Build phone evidence APKs

on:
  workflow_dispatch:

jobs:
  build:
    name: Build app and self-capturing fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Run unit tests and build phone APKs
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Stage phone APKs
        run: |
          mkdir -p staged-apks
          cp app/build/outputs/apk/debug/app-debug.apk staged-apks/CloneHub-Pro.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk staged-apks/CloneHub-Fixture.apk

      - name: Upload phone evidence APKs
        uses: actions/upload-artifact@v4
        with:
          name: CloneHub-Pro-phone-evidence-apks
          path: staged-apks/*.apk
          if-no-files-found: error
