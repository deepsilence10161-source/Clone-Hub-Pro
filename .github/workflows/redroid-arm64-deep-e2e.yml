name: Native ARM64 deep clone testing

permissions:
  contents: write
  actions: read

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - run: chmod +x gradlew
      - name: Build, lint and unit test
        run: |
          set +e
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace > gradle-build.log 2>&1
          echo "GRADLE_EXIT=$?" | tee -a gradle-build.log
          tail -n 250 gradle-build.log
      # Same public diagnosis channel as the other gates: a failing gradle step must leave a
      # readable reason behind, because the job log stream needs repository admin rights.
      - name: Publish build log on failure
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -f gradle-build.log ] || exit 0
          if grep -q "GRADLE_EXIT=0" gradle-build.log; then
            echo "Build succeeded; nothing to publish."
            exit 0
          fi
          grep -E "^e: |error:|Unresolved|cannot find symbol|FAILURE:|Lint found|> Task .* FAILED" \
            gradle-build.log > compile-errors.txt || true
          for f in app/build/reports/lint-results-debug.txt app/build/reports/lint-results-debug.xml; do
            [ -f "$f" ] && cp "$f" "lint-$(basename "$f")" || true
          done
          # GitHub annotations are readable through the checks API without admin rights,
          # so the compiler error also travels this channel if the release upload fails.
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=gradle::$line"
          done < compile-errors.txt
          gh release view ci-diagnostics --repo "${{ github.repository }}" > /dev/null 2>&1 \
            || gh release create ci-diagnostics --repo "${{ github.repository }}" \
                 --prerelease --title "CI diagnostics" --notes "Rolling build diagnostics"
          gh release upload ci-diagnostics gradle-build.log compile-errors.txt \
            lint-lint-results-debug.txt lint-lint-results-debug.xml \
            --repo "${{ github.repository }}" --clobber || true
      # A silently non-zero gradle exit would let every later step run against a stale APK.
      - name: Enforce build result
        run: grep -q "GRADLE_EXIT=0" gradle-build.log
      - run: |
          mkdir -p staged-apks
          cp app/build/outputs/apk/debug/app-debug.apk staged-apks/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk staged-apks/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: deep-redroid-build-binaries
          path: staged-apks/*.apk
          if-no-files-found: error

  deep-e2e:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      PACKAGE_ID: com.clonehub.pro
      TEST_PACKAGE_ID: com.clonehub.pro.test
      MAIN_ACTIVITY: com.clonehub.advanced.ui.home.HomeActivity
      ANDROID_SERIAL: localhost:5555
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deep-redroid-build-binaries
          path: artifacts
      - run: bash .github/scripts/start-redroid-arm64.sh
      - run: bash .github/scripts/run-redroid-deep-e2e.sh
      - name: Collect deep container evidence
        if: always()
        run: |
          mkdir -p deep-evidence
          docker logs "${REDROID_CONTAINER:-redroid}" > deep-evidence/redroid-docker.log 2>&1 || true
          adb -s localhost:5555 shell getprop > deep-evidence/redroid-getprop.txt 2>&1 || true
      # Public diagnosis channel: artifact downloads need account scope that this repository
      # token does not have, so failing evidence is attached to a rolling pre-release instead.
      - name: Publish test evidence to diagnostics release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive="evidence-deep.tar.gz"
          tar -czf "$archive" deep-evidence 2>/dev/null || true
          [ -s "$archive" ] || exit 0
          gh release view ci-diagnostics --repo "${{ github.repository }}" > /dev/null 2>&1 \
            || gh release create ci-diagnostics --repo "${{ github.repository }}" \
                 --prerelease --title "CI diagnostics" --notes "Rolling build and test diagnostics"
          gh release upload ci-diagnostics "$archive" --repo "${{ github.repository }}" --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redroid-arm64-deep-evidence
          path: deep-evidence/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CloneHub-Pro-deep-verified-debug
          path: artifacts/app-debug.apk
          if-no-files-found: error
