name: Native ARM64 deep clone testing

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace
      - run: |
          mkdir -p staged-apks
          cp app/build/outputs/apk/debug/app-debug.apk staged-apks/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk staged-apks/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: deep-redroid-build-binaries
          path: staged-apks/*.apk
          if-no-files-found: error

  deep-e2e:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      PACKAGE_ID: com.clonehub.advanced.debug
      TEST_PACKAGE_ID: com.clonehub.advanced.debug.test
      MAIN_ACTIVITY: com.clonehub.advanced.ui.home.HomeActivity
      ANDROID_SERIAL: localhost:5555
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deep-redroid-build-binaries
          path: artifacts
      - run: bash .github/scripts/start-redroid-arm64.sh
      - run: bash .github/scripts/run-redroid-deep-e2e.sh
      - name: Collect deep container evidence
        if: always()
        run: |
          mkdir -p deep-evidence
          docker logs redroid > deep-evidence/redroid-docker.log 2>&1 || true
          adb -s localhost:5555 shell getprop > deep-evidence/redroid-getprop.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redroid-arm64-deep-evidence
          path: deep-evidence/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CloneHub-Pro-deep-verified-debug
          path: artifacts/app-debug.apk
          if-no-files-found: error
