name: Native ARM64 API compatibility matrix

# The device gates all ran the same Android 14 image, so "works on API 24-35" was never proven.
# This gate boots one emulator per supported Android level and runs a per-level smoke suite:
# install, launch, clone, and the API-behaviour checks that need a specific platform version.
on:
  push:
    branches: ["main", "master"]
    paths:
      - "app/**"
      - ".github/scripts/**"
      - ".github/workflows/redroid-api-matrix.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: redroid-api-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK and instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - run: chmod +x gradlew
      - name: Build, lint and unit test
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Stage binaries
        run: |
          mkdir -p staged-apks
          cp app/build/outputs/apk/debug/app-debug.apk staged-apks/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk staged-apks/
      - uses: actions/upload-artifact@v4
        with:
          name: api-matrix-binaries
          path: staged-apks/

  matrix:
    name: Android API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Bumped on 2026-11-12 (run 43150054571) after the first attempt failed on images that
        # redroid does not publish at all: the ARM64 tags were missing, not the emulator broken.
        # Discovered from the job evidence itself: "manifest unknown" per level.
        include:
          # redroid publishes no ARM64 image for API 24-27 or API 29, and 12.0.0 has no
          # "_64only" tag. The levels below are the real, published ARM64 tags; the gap is stated
          # in the audit instead of being papered over with a fake level.
          - api: 27
            image: "redroid/redroid:8.1.0-latest"
          - api: 28
            image: "redroid/redroid:9.0.0-latest"
          - api: 30
            image: "redroid/redroid:11.0.0-latest"
          - api: 31
            image: "redroid/redroid:12.0.0_64only-240527"
          - api: 35
            image: "redroid/redroid:15.0.0_64only-latest"
          # Mobile-size UI matrix (PhoneUiMatrixInstrumentedTest). It runs on its own level so the
          # per-level smoke suite keeps its identity; it sets the display to 320/360/411dp phones
          # itself, in portrait and landscape, and fails the gate if any control is out of bounds,
          # under a system bar, or smaller than the 48dp touch target.
          - api: 34
            image: "redroid/redroid:14.0.0_64only-latest"
            test_class: com.clonehub.advanced.ui.home.PhoneUiMatrixInstrumentedTest
          # API 36 is deliberately absent: redroid 16.0.0 never finishes booting on this runner
          # (run 43151607712: zygote in a restart loop, sys.boot_completed never set, no error in
          # the container log). Android 16 support is therefore NOT TESTED, not silently assumed.
    env:
      PACKAGE_ID: com.clonehub.pro
      API_LEVEL: ${{ matrix.api }}
      TEST_PACKAGE_ID: com.clonehub.pro.test
      MAIN_ACTIVITY: com.clonehub.advanced.ui.home.HomeActivity
      ANDROID_SERIAL: localhost:5555
      # Docker container names and images are per-matrix-entry so two levels can never fight over
      # the same container or the same runtime data directory.
      REDROID_IMAGE: ${{ matrix.image }}
      REDROID_CONTAINER: redroid-${{ matrix.api }}
      TEST_CLASS: ${{ matrix.test_class || 'com.clonehub.advanced.ui.home.ApiLevelSmokeInstrumentedTest' }}
      # One automatic retry for a level whose Android runtime died (API 27: system_server SIGABRT in
      # Binder during boot, measured on runs 43252415602 and 43257236404). The entry is marked as a
      # retry in the evidence so a pass on the second attempt can never read like a clean first run.
      MATRIX_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: api-matrix-binaries
          path: artifacts
      - name: Boot native ARM64 Android ${{ matrix.api }}
        run: bash .github/scripts/start-redroid-arm64.sh
      - name: Run API ${{ matrix.api }} smoke suite
        run: bash .github/scripts/run-emulator-e2e.sh
      - name: Retry API ${{ matrix.api }} once if the Android runtime died
        if: failure() && github.run_attempt < 3
        id: runtime_retry
        run: |
          # Re-run the whole level only when the evidence says the *platform* failed, not the app:
          # a system_server crash, a dead emulator connection, or no instrumentation result at all.
          if bash .github/scripts/should-retry-level.sh evidence; then
            echo "retrying=true" >> "$GITHUB_OUTPUT"
          else
            echo "retrying=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Re-boot and re-run API ${{ matrix.api }}
        if: failure() && steps.runtime_retry.outputs.retrying == 'true'
        run: |
          echo "level=API $API_LEVEL retry=attempt ${{ github.run_attempt }}" >> evidence/retry.txt
          # The first attempt's evidence is kept, not overwritten: on API 27 the retry printed the
          # real reason (INSTALL_FAILED_OLDER_SDK) that the first attempt had reported only as a
          # broken pipe, and the truncated log needed both attempts to be believed.
          for f in evidence/*.txt evidence/*.log; do
            [ -f "$f" ] && cp "$f" "$f.attempt1" || true
          done
          bash .github/scripts/start-redroid-arm64.sh
          bash .github/scripts/run-emulator-e2e.sh
      - name: Collect evidence for API ${{ matrix.api }}
        if: always()
        run: |
          mkdir -p evidence
          echo "requested_api=$API_LEVEL" > evidence/api-level.txt
          echo "requested_image=$REDROID_IMAGE" >> evidence/api-level.txt
          docker logs "$REDROID_CONTAINER" > evidence/redroid-docker.log 2>&1 || true
          adb -s localhost:5555 shell getprop > evidence/redroid-getprop.txt 2>&1 || true
      - name: Publish API ${{ matrix.api }} evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive="evidence-api-$API_LEVEL.tar.gz"
          tar -czf "$archive" evidence 2>/dev/null || true
          [ -s "$archive" ] || exit 0
          gh release view ci-diagnostics --repo "${{ github.repository }}" > /dev/null 2>&1 \
            || gh release create ci-diagnostics --repo "${{ github.repository }}" \
                 --prerelease --title "CI diagnostics" --notes "Rolling build and test diagnostics"
          gh release upload ci-diagnostics "$archive" --repo "${{ github.repository }}" --clobber
