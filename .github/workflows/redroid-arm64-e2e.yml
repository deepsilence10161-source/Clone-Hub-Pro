name: Native ARM64 redroid strict E2E

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace
      - run: |
          mkdir -p staged-apks
          cp app/build/outputs/apk/debug/app-debug.apk staged-apks/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk staged-apks/app-debug-androidTest.apk
      - name: Download pinned real third-party compatibility apps
        run: bash .github/scripts/download-compatibility-apps.sh staged-apks
      - uses: actions/upload-artifact@v4
        with:
          name: redroid-build-binaries
          path: staged-apks/*.apk
          if-no-files-found: error

  native-e2e:
    name: Strict native ARM64 Android 14 E2E
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      PACKAGE_ID: com.clonehub.pro
      TEST_PACKAGE_ID: com.clonehub.pro.test
      MAIN_ACTIVITY: com.clonehub.advanced.ui.home.HomeActivity
      ANDROID_SERIAL: localhost:5555
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: redroid-build-binaries
          path: artifacts
      - name: Boot native ARM64 Android
        run: bash .github/scripts/start-redroid-arm64.sh
      - name: Run strict visible clone-flow tests
        run: bash .github/scripts/run-emulator-e2e.sh
      - name: Collect native container evidence
        if: always()
        run: |
          mkdir -p evidence
          docker logs redroid > evidence/redroid-docker.log 2>&1 || true
          docker inspect redroid > evidence/redroid-inspect.json 2>&1 || true
          adb -s localhost:5555 shell getprop > evidence/redroid-getprop.txt 2>&1 || true
      - name: Upload strict native E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-arm64-e2e-evidence
          path: evidence/
          if-no-files-found: error
      - name: Upload verified debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CloneHub-Pro-native-ARM64-verified-debug
          path: artifacts/app-debug.apk
          if-no-files-found: error
