name: Real app compatibility smoke

permissions:
  contents: write
  actions: read

on:
  # Every functional change to main must run the real-device suite, not just manual dispatches.
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      test_class:
        description: Fully qualified instrumentation test class, ALL for every test, empty for third-party twins
        required: true
        default: com.clonehub.advanced.ui.home.ThirdPartyCloneCompatibilityInstrumentedTest
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - run: chmod +x gradlew
      # Capture the build output as an artifact so a failing compile can be diagnosed without
      # repository admin access to the job log stream.
      - name: Build, lint and unit test
        run: |
          set +e
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace > gradle-build.log 2>&1
          echo "GRADLE_EXIT=$?" | tee -a gradle-build.log
          tail -n 250 gradle-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-log
          path: gradle-build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      # Diagnosis channel that does not need repository admin rights: on failure the build log
      # is attached to a rolling pre-release, so the compiler error is readable from the API.
      - name: Publish build log on failure
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if grep -q "GRADLE_EXIT=0" gradle-build.log; then
            echo "Build succeeded; nothing to publish."
            exit 0
          fi
          grep -E "^e: |error:|Unresolved|cannot find symbol|FAILURE:|Lint found|> Task .* FAILED" gradle-build.log \
            > compile-errors.txt || true
          # Lint findings live in the report, not the console summary.
          for f in app/build/reports/lint-results-debug.txt app/build/reports/lint-results-debug.xml; do
            [ -f "$f" ] && cp "$f" "lint-$(basename "$f")" || true
          done
          head -n 80 compile-errors.txt || true
          gh release view ci-diagnostics --repo "${{ github.repository }}" > /dev/null 2>&1 \
            || gh release create ci-diagnostics --repo "${{ github.repository }}" \
                 --prerelease --title "CI diagnostics" --notes "Rolling build diagnostics"
          gh release upload ci-diagnostics gradle-build.log compile-errors.txt \
            lint-lint-results-debug.txt lint-lint-results-debug.xml \
            --repo "${{ github.repository }}" --clobber || true
      - name: Enforce build result
        run: grep -q "GRADLE_EXIT=0" gradle-build.log
      - run: |
          mkdir -p staged-apks
          cp app/build/outputs/apk/debug/app-debug.apk staged-apks/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk staged-apks/app-debug-androidTest.apk
      - run: bash .github/scripts/download-compatibility-apps.sh staged-apks
      - uses: actions/upload-artifact@v4
        with:
          name: real-app-compatibility-binaries
          path: staged-apks/*.apk
          if-no-files-found: error

  native-compatibility:
    runs-on: ubuntu-24.04-arm
    needs: build
    timeout-minutes: 25
    env:
      PACKAGE_ID: com.clonehub.pro
      TEST_PACKAGE_ID: com.clonehub.pro.test
      MAIN_ACTIVITY: com.clonehub.advanced.ui.home.HomeActivity
      ANDROID_SERIAL: localhost:5555
      TEST_CLASS: ${{ inputs.test_class }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: real-app-compatibility-binaries
          path: artifacts
      - run: bash .github/scripts/start-redroid-arm64.sh
      - run: bash .github/scripts/run-emulator-e2e.sh
      - if: always()
        run: |
          mkdir -p evidence
          docker logs redroid > evidence/redroid-docker.log 2>&1 || true
          adb -s localhost:5555 shell getprop > evidence/redroid-getprop.txt 2>&1 || true
      # Public diagnosis channel: artifact downloads need account scope that this repository
      # token does not have, so failing evidence is attached to a rolling pre-release instead.
      - name: Publish test evidence to diagnostics release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive="evidence-real-app.tar.gz".replace("real-app", "real-app")
          tar -czf "$archive" evidence 2>/dev/null || true
          [ -s "$archive" ] || exit 0
          gh release view ci-diagnostics --repo "${{ github.repository }}" > /dev/null 2>&1 \
            || gh release create ci-diagnostics --repo "${{ github.repository }}" \
                 --prerelease --title "CI diagnostics" --notes "Rolling build and test diagnostics"
          gh release upload ci-diagnostics "$archive" --repo "${{ github.repository }}" --clobber
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-app-compatibility-evidence
          path: evidence/
          if-no-files-found: error
